<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#14251f"><title>বাংলাদেশ: বেঁচে থাকার লড়াই — 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18251e;color:white;font-family:system-ui,'Noto Sans Bengali',sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:7px;pointer-events:none;flex-wrap:wrap}.pill,#mission{background:#101b2ddd;border:1px solid #ffffff30;border-radius:12px;padding:8px 12px;font-size:13px;box-shadow:0 3px 14px #0006}.pill b{color:#ffd166}#mission{position:fixed;top:60px;left:10px;max-width:80vw}#minimap{position:fixed;right:10px;top:105px;width:116px;height:116px;border:2px solid #ffffff99;border-radius:50%;background:#101b2dcc;box-shadow:0 3px 14px #0008;pointer-events:none}#controls{position:fixed;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.pad,.actions{pointer-events:auto}.pad{display:grid;grid-template-columns:repeat(3,49px);grid-template-rows:repeat(2,46px);gap:4px}.btn{background:#14243ddd;color:white;border:1px solid #ffffff66;border-radius:13px;min-width:46px;min-height:43px;font-size:19px;touch-action:none}.btn:active{background:#d68d32}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:end;max-width:58%}.actions .btn{font-size:12px;padding:0 9px}#toast{display:none;position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:#101b2df2;border:1px solid #ffd166;padding:10px 15px;border-radius:12px;text-align:center;max-width:90vw}#start{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:22px;background:linear-gradient(#08130fe8,#08130ff5)}#start section{max-width:480px}h1{font-size:clamp(26px,6vw,42px);color:#ffd166;margin:0 0 12px}p{line-height:1.7;color:#dce6df}.primary{border:0;border-radius:14px;background:#e6a23c;padding:13px 24px;font-size:17px;font-weight:800;color:#17221a}small{color:#b9c8bd}
</style></head><body>
<div id="hud"><div class="pill">💵 টাকা: <b id="money">৳০</b></div><div class="pill">⭐ লেভেল: <b id="level">১</b></div><div class="pill">🛺 <b id="vehicle">হেঁটে</b></div></div><div id="mission">📍 শহরে ঘুরুন, NPC-র কাছে গিয়ে কথা বলুন</div>
<canvas id="minimap" width="232" height="232" aria-label="শহরের মানচিত্র"></canvas><div id="controls"><div class="pad"><span></span><button class="btn" data-key="up">▲</button><span></span><button class="btn" data-key="left">◀</button><button class="btn" data-key="down">▼</button><button class="btn" data-key="right">▶</button></div><div class="actions"><button class="btn" id="talk">কথা / কাজ</button><button class="btn" id="ride">রিকশা</button><button class="btn" id="save">সেভ</button></div></div><div id="toast"></div>
<div id="start"><section><h1>বাংলাদেশ: বেঁচে থাকার লড়াই</h1><p><b>3D ওপেন-ওয়ার্ল্ড ওয়েব প্রোটোটাইপ</b><br>বাংলাদেশি শহরের 3D পরিবেশে হাঁটুন, NPC-র সঙ্গে কথা বলুন, কাজ নিন এবং রিকশা চালান।</p><p><small>মোবাইলের দিকনির্দেশ বাটন অথবা কম্পিউটারে WASD / Arrow keys ব্যবহার করুন।</small></p><button class="primary" id="play">3D গেম শুরু করুন</button></section></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x91c8e5);scene.fog=new THREE.Fog(0x91c8e5,65,190);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe6f5ff,0x526342,2.0));const sun=new THREE.DirectionalLight(0xffedcf,2.1);sun.position.set(-25,40,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(color,roughness=.9)=>new THREE.MeshStandardMaterial({color,roughness});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(260,260),mat(0x78945d));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
function box(x,y,z,w,h,d,color){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));o.position.set(x,y+h/2,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function road(x,z,w,d){const o=new THREE.Mesh(new THREE.BoxGeometry(w,.08,d),mat(0x343a3c));o.position.set(x,.045,z);scene.add(o);for(let p=-w/2+3;p<w/2-1;p+=8){if(w>d){const line=new THREE.Mesh(new THREE.BoxGeometry(3,.02,.12),mat(0xe8ca70));line.position.set(x+p,.1,z);scene.add(line)}}}
road(0,0,220,12);road(0,-36,220,10);road(-38,0,10,220);road(38,0,10,220);
const colors=[0xd9ad78,0xe3c9a1,0xc77f62,0xd7d9cb,0x9cb5a2,0xc8a0b5];
const buildings=[];
for(let i=0;i<34;i++){let x=-95+(i%9)*23,z=-85+Math.floor(i/9)*48;if(Math.abs(x)<17||Math.abs(z)<13)continue;let w=10+(i%3)*2,d=10+(i%2)*3,h=6+(i%5)*2;let b=box(x,0,z,w,h,d,colors[i%colors.length]);buildings.push(b);for(let y=2;y<h;y+=2.7){for(let xx=-w/2+1.5;xx<w/2-1;xx+=3){const win=new THREE.Mesh(new THREE.BoxGeometry(1.15,1.1,.09),mat(0x6f9aaa));win.position.set(x+xx,y,z+d/2+.055);scene.add(win)}}}
function tree(x,z){let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22,.35,2.2,7),mat(0x735039));trunk.position.set(x,1.1,z);scene.add(trunk);let crown=new THREE.Mesh(new THREE.SphereGeometry(1.55,8,7),mat(0x356b3f));crown.position.set(x,3,z);crown.castShadow=true;scene.add(crown)}
for(let i=0;i<48;i++){let x=-105+(i*37)%210,z=-100+(i*61)%200;if(Math.abs(x)<12||Math.abs(z)<9)continue;tree(x,z)}
function person(color=0x2476bd){
 const g=new THREE.Group(),skin=mat(0xb87952),shirt=mat(color),pants=mat(0x263342),shoe=mat(0x171b20),hair=mat(0x211b18);
 const torso=new THREE.Mesh(new THREE.BoxGeometry(.72,.82,.38),shirt);torso.position.y=1.18;torso.castShadow=true;g.add(torso);
 const neck=new THREE.Mesh(new THREE.CylinderGeometry(.12,.14,.18,8),skin);neck.position.y=1.66;g.add(neck);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.255,16,14),skin);head.scale.set(1,1.12,.9);head.position.set(0,1.91,0);head.castShadow=true;g.add(head);
 const cap=new THREE.Mesh(new THREE.SphereGeometry(.26,14,8,0,Math.PI*2,0,Math.PI*.48),hair);cap.position.set(0,2.02,0);g.add(cap);
 const eyeMat=mat(0x171717);for(const x of [-.09,.09]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.025,8,6),eyeMat);eye.position.set(x,1.94,-.224);g.add(eye)}
 const limb=(w,h,d,m,x,y,z)=>{const a=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);a.position.set(x,y,z);a.castShadow=true;g.add(a);return a};
 for(const x of [-.43,.43]){const arm=limb(.19,.68,.2,shirt,x,1.18,0);arm.rotation.z=x<0?-.12:.12;const hand=new THREE.Mesh(new THREE.SphereGeometry(.105,8,7),skin);hand.position.set(x*1.12,.78,0);g.add(hand)}
 for(const x of [-.2,.2]){limb(.23,.62,.25,pants,x,.48,0);limb(.25,.14,.38,shoe,x,.12,-.045)}
 g.userData.walkParts=g.children;scene.add(g);return g
}
const player=person(0x1c83c7);player.position.set(0,0,17);
const npcData=[{x:10,z:-7,name:'চায়ের দোকানদার',job:'চায়ের দোকানে মাল পৌঁছে দিন',reward:120,target:[-25,-30]},{x:-20,z:18,name:'যাত্রী',job:'যাত্রীকে বাসস্ট্যান্ডে পৌঁছে দিন',reward:250,target:[48,-34]},{x:55,z:-15,name:'গুদাম মালিক',job:'গুদাম থেকে বাজারে মাল পৌঁছে দিন',reward:180,target:[-55,45]},{x:-52,z:42,name:'দোকানদার',job:'দোকানে সাহায্য করুন',reward:150,target:[12,50]}];
const npcs=npcData.map((n,i)=>{let g=person([0xd18c43,0x328b70,0x8758aa,0xb34d4d][i]);g.position.set(n.x,0,n.z);return g});
function wheel(parent,x,y,z,r=.38){const w=new THREE.Mesh(new THREE.TorusGeometry(r,.065,10,20),mat(0x171a1c));w.rotation.y=Math.PI/2;w.position.set(x,y,z);parent.add(w);const hub=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,.13,12),mat(0xb7b9b5));hub.rotation.z=Math.PI/2;hub.position.copy(w.position);parent.add(hub);return w}
const rickshaw=new THREE.Group();
const deck=new THREE.Mesh(new THREE.BoxGeometry(2.1,.18,.92),mat(0xd79b32));deck.position.y=.72;rickshaw.add(deck);
const passengerSeat=new THREE.Mesh(new THREE.BoxGeometry(.78,.5,.8),mat(0x9d3030));passengerSeat.position.set(-.45,1.04,0);rickshaw.add(passengerSeat);
const back=new THREE.Mesh(new THREE.BoxGeometry(.12,.72,.82),mat(0x277d62));back.position.set(-.88,1.27,0);rickshaw.add(back);
const canopy=new THREE.Mesh(new THREE.BoxGeometry(1.55,.13,1.2),mat(0x16845e));canopy.position.set(-.35,2.02,0);rickshaw.add(canopy);
for(const z of [-.48,.48]){const post=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,1.25,7),mat(0xd8b66d));post.position.set(-.82,1.48,z);rickshaw.add(post);const post2=post.clone();post2.position.x=.28;rickshaw.add(post2)}
wheel(rickshaw,.55,.42,0,.34);wheel(rickshaw,-.75,.42,.53,.4);wheel(rickshaw,-.75,.42,-.53,.4);
const handle=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.9,8),mat(0x242424));handle.rotation.x=Math.PI/2;handle.position.set(.75,1.18,0);rickshaw.add(handle);
rickshaw.position.set(4,0,21);scene.add(rickshaw);
function makeVehicle(type,color,x,z,rotation=0){
 const g=new THREE.Group(),paint=mat(color,.55),glass=mat(0x8fc4d4,.28),rubber=mat(0x17191c);
 if(type==='bus'){
  const body=new THREE.Mesh(new THREE.BoxGeometry(3.2,1.65,1.55),paint);body.position.y=1.12;g.add(body);
  const roof=new THREE.Mesh(new THREE.BoxGeometry(3.05,.13,1.48),mat(0xe8e5d8));roof.position.y=2;g.add(roof);
  for(let i=0;i<5;i++){const win=new THREE.Mesh(new THREE.BoxGeometry(.48,.55,.035),glass);win.position.set(-1.2+i*.6,1.45,-.79);g.add(win)}
  const windshield=new THREE.Mesh(new THREE.BoxGeometry(.85,.58,.04),glass);windshield.position.set(1.61,1.48,0);g.add(windshield);
 }else{
  const body=new THREE.Mesh(new THREE.BoxGeometry(2.15,.62,1.12),paint);body.position.y=.72;g.add(body);
  const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.15,.62,1),paint);cabin.position.set(-.12,1.28,0);g.add(cabin);
  for(const zside of [-.57,.57]){const win=new THREE.Mesh(new THREE.BoxGeometry(.82,.38,.025),glass);win.position.set(-.12,1.32,zside);g.add(win)}
  const front=new THREE.Mesh(new THREE.BoxGeometry(.48,.36,.035),glass);front.position.set(.47,1.34,0);g.add(front);
 }
 const wheelXs=type==='bus'?[-1.05,1.05]:[-.68,.72];
 for(const xx of wheelXs)for(const zz of [-.59,.59]){const w=new THREE.Mesh(new THREE.CylinderGeometry(type==='bus'?.3:.25,type==='bus'?.3:.25,.16,14),rubber);w.rotation.x=Math.PI/2;w.position.set(xx,.36,zz);g.add(w)}
 g.position.set(x,0,z);g.rotation.y=rotation;g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});scene.add(g);return g
}
const traffic=[makeVehicle('car',0xe3d9c8,-16,.3,Math.PI/2),makeVehicle('car',0x2677a8,25,-2,Math.PI/2),makeVehicle('bus',0xd34e38,-48,-36,Math.PI/2),makeVehicle('bus',0x26845c,58,36,-Math.PI/2),makeVehicle('car',0xd4a62e,-35,9,Math.PI/2)];
const parkedBike=new THREE.Group();const bikeFrame=new THREE.Mesh(new THREE.BoxGeometry(.85,.16,.22),mat(0xc83b2d));bikeFrame.position.y=.72;parkedBike.add(bikeFrame);for(const xx of [-.48,.48]){const bw=new THREE.Mesh(new THREE.TorusGeometry(.31,.055,8,16),mat(0x17191c));bw.rotation.y=Math.PI/2;bw.position.set(xx,.36,0);parkedBike.add(bw)}const bikeSeat=new THREE.Mesh(new THREE.BoxGeometry(.48,.12,.3),mat(0x202020));bikeSeat.position.set(-.05,1,0);parkedBike.add(bikeSeat);const bikeHandle=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.55,8),mat(0x222222));bikeHandle.rotation.z=Math.PI/2;bikeHandle.position.set(.52,1.05,0);parkedBike.add(bikeHandle);parkedBike.position.set(8,0,3);scene.add(parkedBike);
let money=0,level=1,mission=-1,target=null,riding=false;const keys={};let camAngle=0;
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2500)}
function dist(a,b){return Math.hypot(a.x-b.x,a.z-b.z)}
function sync(){document.getElementById('money').textContent='৳'+money;document.getElementById('level').textContent=level;document.getElementById('vehicle').textContent=riding?'রিকশা':'হেঁটে'}
const mapCanvas=document.getElementById('minimap'),mapCtx=mapCanvas.getContext('2d');function drawMap(){const c=mapCtx;c.clearRect(0,0,232,232);c.save();c.beginPath();c.arc(116,116,112,0,Math.PI*2);c.clip();c.fillStyle='#263b32';c.fillRect(0,0,232,232);c.strokeStyle='#92999a';c.lineWidth=12;c.beginPath();c.moveTo(0,116);c.lineTo(232,116);c.moveTo(116,0);c.lineTo(116,232);c.moveTo(0,76);c.lineTo(232,76);c.stroke();c.fillStyle='#e6c76e';for(const n of npcData){const x=116+n.x*.72,y=116+n.z*.72;c.beginPath();c.arc(x,y,4,0,Math.PI*2);c.fill()}if(target){c.fillStyle='#ffb347';c.beginPath();c.arc(116+target.x*.72,116+target.z*.72,6,0,Math.PI*2);c.fill()}const p=riding?rickshaw.position:player.position;c.fillStyle='#4ecbff';c.beginPath();c.arc(116+p.x*.72,116+p.z*.72,6,0,Math.PI*2);c.fill();c.strokeStyle='#ffffff';c.lineWidth=2;c.stroke();c.restore()}
function talk(){let p=player.position;let near=0;for(let i=1;i<npcs.length;i++)if(dist(p,npcs[i].position)<dist(p,npcs[near].position))near=i;if(dist(p,npcs[near].position)>5){toast('কাছাকাছি কোনো NPC নেই।');return}if(mission>=0){toast('আগের কাজটি আগে শেষ করুন।');return}mission=near;target=new THREE.Vector3(...[npcData[near].target[0],0,npcData[near].target[1]]);document.getElementById('mission').textContent='🎯 কাজ: '+npcData[near].job+' — চিহ্নিত স্থানে যান';toast(npcData[near].name+': '+npcData[near].job)}
document.getElementById('talk').onclick=talk;
document.getElementById('ride').onclick=()=>{if(dist(player.position,rickshaw.position)<4.5){riding=!riding;toast(riding?'রিকশায় উঠেছেন!':'রিকশা থেকে নেমেছেন।');sync()}else toast('রিকশার কাছে যান।')};
document.getElementById('save').onclick=()=>{localStorage.setItem('bd3d-save',JSON.stringify({x:player.position.x,z:player.position.z,money,level,mission}));toast('গেম সেভ হয়েছে।')};
try{const s=JSON.parse(localStorage.getItem('bd3d-save'));if(s){player.position.set(s.x,0,s.z);money=s.money||0;level=s.level||1;sync()}}catch{}
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='ArrowUp')keys.up=true;if(e.key==='ArrowDown')keys.down=true;if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;keys.up=keys.ArrowUp=false;keys.down=keys.ArrowDown=false;keys.left=keys.ArrowLeft=false;keys.right=keys.ArrowRight=false});
let running=false,last=0;function animate(t){if(!running)return;requestAnimationFrame(animate);let dt=Math.min((t-last)/16.67||1,2);last=t;let dx=0,dz=0;if(keys.up||keys.w)dz-=1;if(keys.down||keys.s)dz+=1;if(keys.left||keys.a)dx-=1;if(keys.right||keys.d)dx+=1;let len=Math.hypot(dx,dz)||1;const speed=(riding?.22:.13)*dt;dx=dx/len*speed;dz=dz/len*speed;if(dx||dz){const obj=riding?rickshaw:player;obj.position.x+=dx;obj.position.z+=dz;obj.rotation.y=Math.atan2(dx,dz);if(riding)player.position.copy(rickshaw.position)}
if(mission>=0&&target&&dist(player.position,target)<4.5){money+=npcData[mission].reward;level=Math.floor(money/300)+1;toast('মিশন সম্পন্ন! ৳'+npcData[mission].reward+' পেয়েছেন।');mission=-1;target=null;sync();document.getElementById('mission').textContent='📍 পরের কাজের জন্য NPC-র কাছে যান'}
const focus=riding?rickshaw.position:player.position;player.visible=!riding;const desired=new THREE.Vector3(focus.x+Math.sin(camAngle)*9,7.2,focus.z+Math.cos(camAngle)*9);camera.position.lerp(desired,.09);camera.lookAt(focus.x,1.1,focus.z);drawMap();for(const v of traffic){v.position.x+=Math.sin(t*.00022+v.position.z)*.012*dt;if(v.position.x>112)v.position.x=-112;if(v.position.x< -112)v.position.x=112}renderer.render(scene,camera)}
document.getElementById('play').onclick=()=>{document.getElementById('start').style.display='none';running=true;last=performance.now();requestAnimationFrame(animate)};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
